name: Deploy staging

# Merging to main deploys staging, but so does running this by hand on any
# branch: a long-running branch needs somewhere to stand its stack up before it
# is fit to merge, and making the merge the only way in forces that order.
#
# Staging is the isolated Cloudflare stack: the API Worker and its own D1
# database at vita-api-staging.rigos.dev, and the web Worker at
# vita-staging.rigos.dev. Both hostnames share rigos.dev so the session cookie
# reaches the API. Nothing here touches production resources.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # An explicit bash shell adds pipefail, so `smoke | tee` fails the step.
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_WORKER_NAME: vita-os-api-staging
      API_DOMAIN: vita-api-staging.rigos.dev
      WEB_WORKER_NAME: vita-os-web-staging
      WEB_DOMAIN: vita-staging.rigos.dev
      D1_DATABASE: vita-os-staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert API deploy target
        working-directory: apps/api
        run: node scripts/assert-deploy-target.mjs staging "$API_WORKER_NAME" "$API_DOMAIN"

      # build:staging pins VITE_API_BASE_URL to the staging API hostname.
      - name: Build staging web
        run: bun run --cwd apps/web build:staging

      - name: Assert web deploy target
        working-directory: apps/web
        env:
          EXPECT_CUSTOM_DOMAIN: ${{ env.WEB_DOMAIN }}
        run: node scripts/assert-deploy-target.mjs "$WEB_WORKER_NAME"

      # Schema first, so the new API never runs against an older database.
      - name: Apply staging D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply ${{ env.D1_DATABASE }} --remote --env staging

      - name: Deploy staging API Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env staging

      - name: Deploy staging web Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke test staging API
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/api
        run: node scripts/smoke-deployment.mjs "https://$API_DOMAIN" "https://$WEB_DOMAIN" | tee smoke-staging-api.log

      - name: Smoke test staging web
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        run: node scripts/smoke-deployment.mjs "https://$WEB_DOMAIN" | tee smoke-staging.log

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-evidence
          path: |
            apps/api/smoke-staging-api.log
            apps/web/smoke-staging.log
            apps/web/dist/wrangler.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured; the build was verified but nothing was deployed."
