name: Deploy staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: vita-os-web-staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Staging points at a non-production Convex deployment when one is
      # configured. Better Auth only trusts the production origin, so an
      # unconfigured staging is still useful for unauthenticated checks.
      - name: Resolve Convex target
        id: convex
        env:
          NONPROD_URL: ${{ vars.VITE_CONVEX_URL_NONPROD }}
          NONPROD_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL_NONPROD }}
          PROD_URL: ${{ vars.VITE_CONVEX_URL }}
          PROD_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
        run: |
          if [ -n "$NONPROD_URL" ] && [ -n "$NONPROD_SITE_URL" ]; then
            echo "url=$NONPROD_URL" >> "$GITHUB_OUTPUT"
            echo "site_url=$NONPROD_SITE_URL" >> "$GITHUB_OUTPUT"
            echo "Staging build targets the non-production Convex deployment."
          else
            echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
            echo "site_url=$PROD_SITE_URL" >> "$GITHUB_OUTPUT"
            echo "::warning::VITE_CONVEX_URL_NONPROD is unset, so staging reads production Convex data. Set the non-production repository variables before using staging for write testing."
          fi

      - name: Build staging
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}
          VITE_CONVEX_SITE_URL: ${{ steps.convex.outputs.site_url }}
        run: bun run --cwd apps/web build:staging

      - name: Assert deploy target
        working-directory: apps/web
        run: node scripts/assert-deploy-target.mjs "$WORKER_NAME"

      - name: Deploy staging Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke test staging
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.WORKERS_DEV_SUBDOMAIN != ''
        working-directory: apps/web
        run: |
          origin="https://$WORKER_NAME.${{ vars.WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          echo "Staging origin: $origin"
          node scripts/smoke-deployment.mjs "$origin" | tee smoke-staging.log

      - name: Report a missing workers.dev subdomain
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.WORKERS_DEV_SUBDOMAIN == ''
        run: echo "::warning::WORKERS_DEV_SUBDOMAIN is unset, so the staging deploy was not smoke tested."

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-evidence
          path: |
            apps/web/smoke-staging.log
            apps/web/dist/wrangler.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured; the build was verified but nothing was deployed."
