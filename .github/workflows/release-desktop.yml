name: Release desktop

# Pushing a tag `desktop-v<version>` that matches apps/desktop/package.json's version verifies the
# repository, builds the macOS app for Apple silicon, and publishes it as a GitHub Release. The
# desktop app's update check reads these releases (ADR 0043). The build is ad-hoc signed, not
# notarized: see "Install on macOS" in apps/desktop/README.md.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag names the desktop app's version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json's version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: bun run package:desktop

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "apps/desktop/out/Vita OS-$VERSION-arm64.dmg" \
            --verify-tag \
            --title "Vita OS $VERSION for Mac" \
            --generate-notes
