name: Deploy production

# Production is never deployed by merging; someone runs this on purpose. The
# cutover order in docs/migrations/production-cutover.md decides when: the
# first run switches vita.rigos.dev onto this stack.
#
# Production is the API Worker and its D1 database at vita-api.rigos.dev, and
# the web Worker at vita.rigos.dev. Both hostnames share rigos.dev so the
# session cookie reaches the API.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vita.rigos.dev
    # An explicit bash shell runs every step with -e and pipefail.
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_WORKER_NAME: vita-os-api
      API_DOMAIN: vita-api.rigos.dev
      WEB_WORKER_NAME: vita-os-web
      WEB_DOMAIN: vita.rigos.dev
      D1_DATABASE: vita-os-production
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured to deploy production."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails until the production D1 ID replaces the placeholder.
      - name: Assert API deploy target
        working-directory: apps/api
        run: node scripts/assert-deploy-target.mjs production "$API_WORKER_NAME" "$API_DOMAIN"

      # build:production pins VITE_API_BASE_URL to the production API hostname.
      - name: Build production web
        run: bun run --cwd apps/web build:production

      - name: Route-split chunk check
        working-directory: apps/web
        run: node scripts/check-chunks.mjs

      - name: Assert web deploy target
        working-directory: apps/web
        env:
          EXPECT_CUSTOM_DOMAIN: ${{ env.WEB_DOMAIN }}
        run: node scripts/assert-deploy-target.mjs "$WEB_WORKER_NAME"

      # The version serving vita.rigos.dev before this run is the rollback
      # target. On the cutover run it is the build being replaced.
      - name: Record the web version being replaced
        working-directory: apps/web
        run: |
          bunx wrangler deployments status --name "$WEB_WORKER_NAME" --json | tee previous-web-deployment.json
          {
            echo "### Rollback target"
            echo
            echo "Before this run, \`$WEB_WORKER_NAME\` served:"
            echo
            echo '```json'
            cat previous-web-deployment.json
            echo '```'
            echo
            echo "Roll back with \`bunx wrangler rollback <version-id> --name $WEB_WORKER_NAME --message \"<reason>\" --yes\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Schema first, so the new API never runs against an older database.
      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply ${{ env.D1_DATABASE }} --remote --env production

      - name: Deploy production API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production

      # The API must pass before the web deploy moves traffic onto it. A custom
      # domain created by this deploy has no DNS record for its first seconds,
      # so each smoke test retries for about two minutes.
      - name: Smoke test production API
        working-directory: apps/api
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            if node scripts/smoke-deployment.mjs "https://$API_DOMAIN" "https://$WEB_DOMAIN" > smoke-production-api.log 2>&1; then
              cat smoke-production-api.log
              exit 0
            fi
            cat smoke-production-api.log
            echo "Attempt $attempt failed; retrying in 20s."
            sleep 20
          done
          exit 1

      - name: Deploy production web Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Smoke test production web
        working-directory: apps/web
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            if node scripts/smoke-deployment.mjs "https://$WEB_DOMAIN" > smoke-production.log 2>&1; then
              cat smoke-production.log
              exit 0
            fi
            cat smoke-production.log
            echo "Attempt $attempt failed; retrying in 20s."
            sleep 20
          done
          exit 1

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-evidence
          path: |
            apps/web/previous-web-deployment.json
            apps/api/smoke-production-api.log
            apps/web/smoke-production.log
            apps/web/dist/wrangler.json
          if-no-files-found: ignore
          retention-days: 90
