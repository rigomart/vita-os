<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vita OS" />
    <!-- The page draws under the status bar; the sky header fills it. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      // The stored theme, applied before the first paint so a dark start never
      // flashes white. `initializeTheme` in @vita-os/application takes over
      // once the app loads; the key and colours are its.
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("vita-os:theme") || "system";
        } catch (error) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0e0f11" : "#f6f6f8");
      })();
    </script>

    <title>Vita OS</title>
    <meta
      name="description"
      content="A personal operating system for tasks, projects, and goals."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vita OS" />
    <meta
      property="og:description"
      content="A personal operating system for tasks, projects, and goals."
    />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vita OS" />
    <meta
      name="twitter:description"
      content="A personal operating system for tasks, projects, and goals."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
